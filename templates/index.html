<html lang="ru">
<head>
    <title>Lab1</title>
    <link rel="stylesheet" href="/static/styles/index_style.css">
</head>
<body>
    <header>
        <img src="/static/img/image2.png" alt="Молния">
        <h1>Вычисление мощности ИБП</h1>
    </header>
    
    <h1>Устройства</h1>

    <form class="search-form" action="/" method="GET">
        <input type="text" name="query" placeholder="Поиск компонентов" value="{{ .query }}">
        <button type="submit">Найти</button>
    </form>
    
    <div class="devices-container">
        {{ range .orders}}
        <div class="card">
            <img src="{{ .Image }}" alt="Изображние" class="card-image">
            <div class="card-title">{{ .Title}}</div>
            <div class="card-actions">
                <a href="/component/{{ .ID }}" class="btn-details">Подробнее</a>
                <form method="POST" action="/add-to-bid" style="display:inline;">
                    <input type="hidden" name="component_id" value="{{ .ID }}">
                    <button type="submit" class="btn-add">В заявку</button>
                </form>
            </div>
        </div>
        {{ end }}
    </div>
    
    <a href="/bid/7" class="cart-icon">
    <img src="http://127.0.0.1:9000/test/image4.png" alt="Корзина">
    <span class="cart-count">{{ .count }}</span>
    </a>

</body>
</html>
